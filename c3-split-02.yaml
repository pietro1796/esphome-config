substitutions:
  device_name: c3-split-02
  friendly_name: Clima Giorno
  ip_addres: 192.168.100.54
  platform: esp32
  board: esp32-c3-devkitm-1
packages:
  common: !include 'packages/common-espidf.yaml'
uart:
  id: hp_uart
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 2400
  parity: EVEN
  data_bits: 8
  stop_bits: 1
climate:
- platform: mitsubishi_cn105
  id: mitsubishi
  name: ${friendly_name}
  uart_id: hp_uart
  update_interval: 5s
  supported_swing_modes: VERTICAL
esphome:
  name: c3-split-02
